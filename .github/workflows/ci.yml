name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres: # the job-queue tests also run against Postgres (FOR UPDATE SKIP LOCKED)
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: priorauth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LLM_MODE: replay # every model call comes from eval/cassettes; no API key exists in this job
      PRIORAUTH_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/priorauth_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Setup (locked environment)
        run: make setup
      - name: Lint (ruff) and types (mypy --strict)
        run: make lint
      - name: Tests
        run: make test
      - name: Regression gate (replayed cassettes)
        run: make gate

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.28.0 (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          v=8.28.0
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -sSfLO "$base/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${v}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${v}_checksums.txt"
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
      - name: Scan every commit and the working tree
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 .
