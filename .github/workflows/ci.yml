name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LLM_MODE: replay # every model call comes from eval/cassettes; no API key exists in this job
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Setup (locked environment)
        run: make setup
      - name: Lint (ruff) and types (mypy --strict)
        run: make lint
      - name: Tests
        run: make test
      - name: Regression gate (replayed cassettes)
        run: make gate
