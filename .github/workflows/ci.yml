name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres: # the job-queue tests also run against Postgres (FOR UPDATE SKIP LOCKED)
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: priorauth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      jaeger: # tests/test_jaeger.py exports spans over OTLP/HTTP and reads them back from the query API
        image: jaegertracing/jaeger:2.11.0
        ports: ["16686:16686", "4318:4318"]
    env:
      LLM_MODE: replay # every model call comes from eval/cassettes; no API key exists in this job
      PRIORAUTH_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/priorauth_test
      PRIORAUTH_TEST_JAEGER_URL: http://localhost:16686
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Setup (locked environment)
        run: make setup
      - name: Lint (ruff) and types (mypy --strict)
        run: make lint
      - name: Wait for Jaeger
        run: for i in $(seq 1 30); do curl -sf http://localhost:16686/ > /dev/null && exit 0; sleep 2; done; exit 1
      - name: Tests
        run: make test
      - name: Tests named by the covered rows of docs/HIPAA_ALIGNMENT.md
        run: make hipaa-tests
      - name: Regression gate (replayed cassettes)
        run: make gate
      - name: Load tests on SQLite and on the Postgres service (simulated model; deterministic part checked)
        run: |
          uv run python -m eval.load_test --out ci-results/load_test.json --expect results/load_test.json
          uv run python -m eval.load_test --database-url "$PRIORAUTH_TEST_POSTGRES_URL" --reset-database \
            --out ci-results/load_test_postgres.json --expect results/load_test_postgres.json
      - name: Upload the load-test results of this runner
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: ci-results/

  ui:
    name: reviewer UI (types, Vitest, build, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LLM_MODE: replay # the demo API replays recorded real responses (eval/cassettes); nothing calls a model
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Setup (locked Python and Node environments)
        run: make setup ui-setup
      - name: API types, TypeScript strict, Vitest, production build
        run: make ui-test
      - name: Install Chromium for Playwright
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: End-to-end journeys (demo API replaying recorded real model responses)
        run: make ui-e2e

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.28.0 (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          v=8.28.0
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -sSfLO "$base/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${v}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${v}_checksums.txt"
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
      - name: Scan every commit and the working tree
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 .
