[project]
name = "priorauth"
version = "0.1.0"
description = "Prior-authorization agent on synthetic clinical records: LLM extracts cited evidence, a deterministic policy engine decides APPROVE or PEND."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seifeddine BEN RHOUMA" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.15.0",
    "asyncpg>=0.32.0",
    "cryptography>=46",
    "fastapi>=0.146.0",
    "fhir-resources>=8.3.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pyjwt>=2.10",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
priorauth = "priorauth.cli:main"

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "hypothesis>=6.170.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PTH", # use pathlib
    "S",   # flake8-bandit
]
ignore = [
    "S311", # `random` is used for seeded synthetic data generation, not for security
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"] # assert is the point of a test; test fixtures use fake secrets

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "eval", "tests"]
mypy_path = ["src", "."]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true
