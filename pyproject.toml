[project]
name = "priorauth"
version = "0.1.0"
description = "Prior-authorization agent on synthetic clinical records: LLM extracts cited evidence, a deterministic policy engine decides APPROVE or PEND."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seifeddine BEN RHOUMA" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PTH", # use pathlib
    "S",   # flake8-bandit
]
ignore = [
    "S311", # `random` is used for seeded synthetic data generation, not for security
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is the point of a test

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "eval", "tests"]
mypy_path = ["src", "."]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true
