apiVersion: apps/v1
kind: Deployment
metadata:
  name: priorauth-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: priorauth-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: priorauth-ui
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's "node" user, numeric so that the kubelet can check it is not root
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: priorauth-ui
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PRIORAUTH_API_URL # read at request time by the /api/* route
              value: http://priorauth-api:8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: next-cache
              mountPath: /ui/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: priorauth-ui
spec:
  selector:
    app.kubernetes.io/name: priorauth-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
