apiVersion: apps/v1
kind: Deployment
metadata:
  name: priorauth-api
spec:
  replicas: 1 # state lives in the pod (SQLite, token-signing secret): a second replica would not share it
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: priorauth-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: priorauth-api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false # no injected PRIORAUTH_API_* service variables next to the app's own
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: priorauth-api
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DEMO_LIVE_ENABLED
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe: # seeding the examples takes a few seconds; /healthz answers once it is done
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp # the SQLite file of the demo
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: priorauth-api
spec:
  selector:
    app.kubernetes.io/name: priorauth-api
  ports:
    - name: http
      port: 8000
      targetPort: http
